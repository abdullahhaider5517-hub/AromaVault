<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AromaVault — Product</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080706;
    color:#fff;
    font-family:Poppins,sans-serif
}

header{
    text-align:center;
    padding:25px;
    background:#090807;
    border-bottom:1px solid #332b19;
    position:sticky;
    top:0;
    z-index:10
}

header h1{
    margin:0;
    color:#f1d58a;
    font:700 36px "Playfair Display";
    letter-spacing:5px
}

nav{
    margin-top:10px
}

nav a{
    color:#aaa;
    text-decoration:none;
    margin:0 15px;
    font-size:14px
}

nav a:hover{
    color:#f1d58a
}

.page{
    max-width:1100px;
    margin:55px auto;
    padding:0 20px
}

.product{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:55px;
    align-items:center
}

.image{
    min-height:550px;
    border:1px solid #40351d;
    border-radius:18px;
    background:radial-gradient(circle,#25232b,#0c0b0a 65%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px
}

.image img{
    max-width:92%;
    max-height:500px;
    object-fit:contain
}

.eyebrow{
    color:#d4af37;
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase
}

.title{
    font:700 clamp(34px,4vw,56px)/1.08 "Playfair Display";
    margin:12px 0
}

.rating{
    color:#f1c75b;
    margin:15px 0 25px
}

.price{
    color:#f1d58a;
    font-size:30px;
    font-weight:700;
    margin-bottom:28px
}

label{
    display:block;
    color:#aaa;
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    margin:20px 0 10px
}

.sizes{
    display:flex;
    gap:10px
}

.size{
    padding:12px 22px;
    border:1px solid #444;
    background:#111;
    color:#fff;
    border-radius:6px;
    cursor:pointer;
    font-weight:700
}

.size.active,
.size:hover{
    background:#d4af37;
    color:#080706;
    border-color:#d4af37
}

.qty{
    display:flex;
    align-items:center;
    border:1px solid #333;
    width:max-content;
    border-radius:6px;
    overflow:hidden
}

.qty button{
    width:45px;
    height:42px;
    border:0;
    background:#121212;
    color:#fff;
    font-size:20px;
    cursor:pointer
}

.qty span{
    width:45px;
    text-align:center
}

.buy{
    width:100%;
    margin-top:28px;
    padding:17px;
    border:0;
    border-radius:6px;
    background:linear-gradient(135deg,#f1d58a,#b98b25);
    color:#080706;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer
}

.trust{
    display:flex;
    gap:10px;
    margin-top:22px
}

.trust div{
    flex:1;
    text-align:center;
    color:#888;
    font-size:11px;
    border-top:1px solid #282319;
    padding-top:12px
}

footer{
    text-align:center;
    color:#666;
    padding:30px;
    margin-top:70px;
    border-top:1px solid #181614
}

@media(max-width:800px){

    .product{
        grid-template-columns:1fr;
        gap:30px
    }

    .image{
        min-height:420px
    }

    .trust{
        display:grid;
        grid-template-columns:1fr
    }
}
</style>
</head>

<body>

<header>

<h1>AROMA VAULT</h1>

<nav>
<a href="home.html">Home</a>
<a href="new arrival.html">New Arrivals</a>
<a href="https://wa.me/923317744660" target="_blank">Contact</a>
</nav>

</header>


<main class="page">

<a href="home.html#collection"
style="display:inline-block;margin-bottom:25px;color:#d4af37;text-decoration:none;font-size:13px;">
← Back to Fragrances
</a>


<section class="product">


<div class="image">

<img
id="productImage"
src="1.png"
alt="AromaVault fragrance">

</div>


<div>

<div class="eyebrow">
AromaVault Fragrance
</div>


<div class="title" id="productTitle">
Premium Fragrance
</div>


<div class="rating">
★★★★★
<span style="color:#777">(4.9 / 5.0)</span>
</div>


<div class="price" id="productPrice">
Rs. 2,450
</div>


<label>Select Size</label>




<label>Quantity</label>


<div class="qty">

<button onclick="changeQty(-1)">
−
</button>

<span id="qty">
1
</span>

<button onclick="changeQty(1)">
+
</button>

</div>


<button class="buy" onclick="placeOrder()">
Order Now on WhatsApp
</button>


<div class="trust">

<div>
Premium Quality
</div>

<div>
Long Lasting
</div>

<div>
Secure Shopping
</div>

</div>

</div>

</section>

</main>


<footer>
© 2026 AromaVault — Luxury Scents, Made Accessible.
</footer>


<script>

const p = new URLSearchParams(window.location.search);

const title = p.get("title") || "Premium Fragrance";

const price = p.get("price") || "2,450";

const img = p.get("img") || "1.png";


document.title = "AromaVault — " + title;


document.getElementById("productTitle").textContent = title;

document.getElementById("productPrice").textContent = "Rs. " + price;

document.getElementById("productImage").src = img;

document.getElementById("productImage").alt = title;


let qty = 1;

let size = "50";


document.querySelectorAll(".size").forEach(b => {

    b.onclick = () => {

        document
        .querySelectorAll(".size")
        .forEach(x => x.classList.remove("active"));

        b.classList.add("active");

        size = b.dataset.size;

    };

});


function changeQty(n){

    qty = Math.max(1, qty + n);

    document.getElementById("qty").textContent = qty;

}


function placeOrder(){

    let m =
    "Hello AromaVault!%0A%0A" +
    "I want to order: " +
    encodeURIComponent(title) +
    "%0A" +
    "Size: " +
    encodeURIComponent(size) +
    "%0A" +
    "Quantity: " +
    qty +
    "%0A" +
    "Price: Rs. " +
    encodeURIComponent(price);

    open(
        "https://wa.me/923317744660?text=" + m,
        "_blank"
    );

}

</script>

</body>
</html>
